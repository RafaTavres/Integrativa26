name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # As credenciais do Supabase são lidas em runtime (/api/config), então o
      # build roda sem secrets.
      - run: npm run build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t estokar:ci .
