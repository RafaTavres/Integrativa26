name: estokar

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: estokar:latest
    # No VPS com proxy reverso, use APP_BIND=127.0.0.1 para não expor a porta.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    # Credenciais ficam fora da imagem: entram no container em tempo de
    # execução. Trocar de projeto Supabase não exige rebuild.
    # `.env` é o padrão no servidor; `.env.local` continua valendo no dev.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Túnel temporário para testar em uma URL pública:
  #   docker compose --profile public up -d
  #   docker compose logs -f tunnel
  #
  # Para uma URL permanente, crie um túnel nomeado no Cloudflare e troque o
  # command por:
  #   tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
